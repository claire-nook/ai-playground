name: Artifact Remote Binary Ingest

# Manual probe for a temporary binary URL.
# The URL is passed only as a workflow_dispatch input and is never committed
# into repository files by this workflow.
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary binary download URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ingest-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mask temporary source URL
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          echo "::add-mask::$SOURCE_URL"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and verify remote binary
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          python scripts/ingest-image-from-url.py \
            --source-url "$SOURCE_URL" \
            --destination "experiments/artifact-transport/publisher-output/soup-remote-ingest.jpg" \
            --expected-bytes "221676" \
            --expected-sha256 "58b6e8211abae2119bd870613ee6c8ccc74c32fc4832e9515bc7952c342a4cd9" \
            --report "experiments/artifact-transport/processed/soup-remote-ingest/report.json"

      - name: Commit verified artifact
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/artifact-transport
          git commit -m "experiment: ingest verified remote soup image artifact"
          git push
