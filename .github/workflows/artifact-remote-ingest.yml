name: Artifact Remote Binary Ingest

# Manual probe for a temporary binary URL.
# The URL is passed only as a workflow_dispatch input and is never committed
# into repository files by this workflow.
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Temporary binary download URL"
        required: true
        type: string
      expected_bytes:
        description: "Expected decoded byte length"
        required: true
        type: string
      expected_sha256:
        description: "Expected SHA-256"
        required: true
        type: string
      output_path:
        description: "Repository output path"
        required: true
        type: string
      request_id:
        description: "Evidence/report identifier"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ingest-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mask temporary source URL
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          echo "::add-mask::$SOURCE_URL"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and verify remote binary
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_BYTES: ${{ inputs.expected_bytes }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          report="experiments/artifact-transport/processed/${REQUEST_ID}/report.json"

          python scripts/ingest-image-from-url.py \
            --source-url "$SOURCE_URL" \
            --destination "$OUTPUT_PATH" \
            --expected-bytes "$EXPECTED_BYTES" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --report "$report"

      - name: Commit verified artifact
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/artifact-transport
          git commit -m "experiment: ingest verified remote image artifact"
          git push
