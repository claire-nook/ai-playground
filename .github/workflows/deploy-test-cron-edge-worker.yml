name: Deploy Test Cron Edge Worker

# Human gate: Claire explicitly starts this experiment deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test-cron-edge-worker:
    runs-on: ubuntu-latest
    env:
      # Project Ref is public metadata; credentials remain managed secrets.
      SUPABASE_PROJECT_REF: cctonymfrxneonxryqei
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: supabase --version

      # Secret Keys are not JWTs. The Supabase server helper validates the apikey header.
      - name: Deploy test-cron-edge-worker
        run: |
          supabase functions deploy test-cron-edge-worker \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Show deployed endpoint
        run: |
          echo "Endpoint: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/test-cron-edge-worker"
