name: Hello Action

# 只允許手動啟動這個 Workflow。
# 目前不綁 push / commit，避免每次修改 Repo 都自動執行。
on:
  workflow_dispatch:

jobs:
  hello-action:
    # GitHub 會臨時提供一台 Linux Runner 執行這個 Job。
    runs-on: ubuntu-latest

    steps:
      # Step 1：確認 Runner 已經開始工作。
      - name: Say hello to Claire
        run: echo "Hello Claire"

      # Step 2：由 Runner 在執行當下產生驗證碼。
      # Claire 與 AI 事前都不知道結果，用來驗證 AI 能否自行讀取 Action Log。
      - name: Generate runtime verification code
        run: |
          code=$(shuf -i 100000-999999 -n 1)
          echo "Verification code: $code"

      # Step 3：顯示這次臨時 Runner 的基本環境資訊。
      - name: Show runner information
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Runner name: $RUNNER_NAME"
          echo "Current UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
