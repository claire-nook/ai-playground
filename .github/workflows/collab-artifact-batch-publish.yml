name: "[COLLAB] Artifact Batch Publish"

# Claire × Primary Agent collaboration tool.
# One-item and multi-item image publication use the same batch contract.
# Temporary source URLs are accepted only as workflow_dispatch input and are
# written to runner temporary storage, never committed into repository files.
#
# Canonical input contract:
# .github/workflow-contracts/artifact-batch-publish.schema.json
on:
  workflow_dispatch:
    inputs:
      batch_json:
        description: "Artifact batch JSON prepared by Primary Agent"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-artifact-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare private batch request
        shell: bash
        env:
          BATCH_JSON: ${{ inputs.batch_json }}
        run: |
          set -euo pipefail

          # Mask every temporary URL before later commands can echo it.
          python - <<'PY'
          import json
          import os

          batch = json.loads(os.environ["BATCH_JSON"])
          for item in batch.get("items", []):
              url = item.get("sourceUrl")
              if url:
                  print(f"::add-mask::{url}")
          PY

          printf '%s' "$BATCH_JSON" > "$RUNNER_TEMP/artifact-batch.json"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and verify complete batch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ingest-image-batch-from-urls.py "$RUNNER_TEMP/artifact-batch.json"

      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/artifact-transport
          git commit -m "collab: publish verified artifact batch"
          git push
