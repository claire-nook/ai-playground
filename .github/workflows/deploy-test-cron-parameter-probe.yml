name: Deploy Test Cron Parameter Probe

# Temporary push trigger exists only to obtain one CLI deployment as runtime evidence;
# final workflow returns to workflow_dispatch-only after this probe.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/test-cron-parameter-probe/**"
      - ".github/workflows/deploy-test-cron-parameter-probe.yml"

permissions:
  contents: read

jobs:
  deploy-test-cron-parameter-probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: cctonymfrxneonxryqei
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Deploy test-cron-parameter-probe
        run: |
          supabase functions deploy test-cron-parameter-probe \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Show deployed endpoint
        run: |
          echo "Endpoint: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/test-cron-parameter-probe"
