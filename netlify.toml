# Netlify deployment configuration for AI Playground.
#
# Trigger Boundary principle:
# only changes that can affect Netlify deployable output or runtime should wake
# the Netlify build pipeline. Research records and other laboratory context stay
# in the repository without causing a deployment by themselves.

[build]
  publish = "public"
  ignore = '''
sh -c '
echo "NETLIFY_TRIGGER_FRESH_BASE_FETCH_PROBE_BEGIN"
printf "CONTEXT=%s\n" "${CONTEXT:-UNSET}"
printf "HEAD=%s\n" "${HEAD:-UNSET}"
printf "COMMIT_REF=%s\n" "${COMMIT_REF:-UNSET}"
printf "REVIEW_ID=%s\n" "${REVIEW_ID:-UNSET}"

if [ "${CONTEXT:-}" != "deploy-preview" ]; then
  echo "PROBE_SKIPPED_CONTEXT_NOT_DEPLOY_PREVIEW"
elif [ -z "${COMMIT_REF:-}" ]; then
  echo "PROBE_FAILED_COMMIT_REF_MISSING"
elif ! probe_commit=$(git rev-parse --verify "${COMMIT_REF}^{commit}" 2>/dev/null); then
  echo "PROBE_FAILED_COMMIT_REF_UNRESOLVED"
else
  echo "COMMIT_REF_RESOLVED_SHA=$probe_commit"
  probe_base_ref="refs/netlify-probe/base"

  echo "FRESH_FETCH_BEGIN"
  echo "FRESH_FETCH_ATTEMPT_DEPTH=64"
  if git fetch --no-tags --depth=64 origin "+main:${probe_base_ref}" >/dev/null 2>&1; then
    echo "FRESH_FETCH_SUCCESS"
    if probe_base=$(git rev-parse --verify "${probe_base_ref}^{commit}" 2>/dev/null); then
      echo "FRESH_FETCHED_BASE_SHA=$probe_base"
      if merge_base=$(git merge-base "$probe_base" "$probe_commit" 2>/dev/null); then
        echo "MERGE_BASE_SUCCESS_SHA=$merge_base"
      else
        echo "MERGE_BASE_FAILED_INITIAL_HISTORY"
        echo "SHALLOW_HISTORY_RETRY_BEGIN"
        echo "SHALLOW_HISTORY_RETRY_REASON=MERGE_BASE_UNAVAILABLE"
        echo "SHALLOW_HISTORY_RETRY_DEPTH=256"
        if git fetch --no-tags --depth=256 origin "+main:${probe_base_ref}" >/dev/null 2>&1; then
          echo "SHALLOW_HISTORY_RETRY_FETCH_SUCCESS"
          if probe_base=$(git rev-parse --verify "${probe_base_ref}^{commit}" 2>/dev/null); then
            echo "FRESH_FETCHED_BASE_SHA_AFTER_RETRY=$probe_base"
            if merge_base=$(git merge-base "$probe_base" "$probe_commit" 2>/dev/null); then
              echo "SHALLOW_HISTORY_RETRY_OUTCOME=MERGE_BASE_SUCCESS"
              echo "MERGE_BASE_SUCCESS_SHA=$merge_base"
            else
              merge_base=""
              echo "SHALLOW_HISTORY_RETRY_OUTCOME=MERGE_BASE_FAILED"
              echo "MERGE_BASE_FAILED_AFTER_RETRY"
            fi
          else
            merge_base=""
            echo "SHALLOW_HISTORY_RETRY_OUTCOME=BASE_REF_UNRESOLVED"
          fi
        else
          merge_base=""
          echo "SHALLOW_HISTORY_RETRY_FETCH_FAILED"
          echo "SHALLOW_HISTORY_RETRY_OUTCOME=FETCH_FAILED"
        fi
        echo "SHALLOW_HISTORY_RETRY_END"
      fi

      if [ -n "${merge_base:-}" ]; then
        echo "CHANGED_PATHS_BEGIN"
        if ! git diff --name-only "$merge_base" "$probe_commit"; then
          echo "CHANGED_PATHS_FAILED"
        fi
        echo "CHANGED_PATHS_END"
      else
        echo "CHANGED_PATHS_SKIPPED_MERGE_BASE_UNAVAILABLE"
      fi
    else
      echo "FRESH_FETCHED_BASE_RESOLVE_FAILED"
    fi
  else
    echo "FRESH_FETCH_FAILURE"
  fi
  echo "FRESH_FETCH_END"
fi

echo "NETLIFY_TRIGGER_FRESH_BASE_FETCH_PROBE_END"
exit 1
'
'''

[functions]
  directory = "netlify/functions"
