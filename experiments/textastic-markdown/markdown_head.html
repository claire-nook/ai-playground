<!-- 給 Textastic 使用的 head 片段，不要放 <html> 或 <body> -->

<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- 可選：載入 Noto Sans TC，介面比較像你原本工具 -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" />

<!-- Highlight.js：使用官方 cdn-release 的 browser build。
     只主動處理我們技術文件實際會使用的語言，不啟用 auto-detect。 -->
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.12.0/build/highlight.min.js"></script>

<!-- Mermaid：讓 ```mermaid code block 變流程圖 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>
  // 技術文件實用白名單。Alias 會正規化成 Highlight.js 的 canonical language name。
  var supportedFenceLanguages = {
    sql: 'sql',
    json: 'json',
    javascript: 'javascript',
    js: 'javascript',
    typescript: 'typescript',
    ts: 'typescript',
    html: 'xml',
    css: 'css',
    bash: 'bash',
    shell: 'bash',
    sh: 'bash',
    yaml: 'yaml',
    yml: 'yaml'
  };

  function normalizeFenceLanguage(value) {
    if (!value) return '';
    return supportedFenceLanguages[value.trim().toLowerCase()] || '';
  }

  // 找出 MultiMarkdown / 常見 Markdown renderer 可能留下的 fenced-code 語言資訊。
  function getFenceLanguage(code) {
    if (!code) return '';

    var pre = code.parentElement;
    var candidates = [code, pre];

    for (var i = 0; i < candidates.length; i += 1) {
      var element = candidates[i];
      if (!element) continue;

      var dataLanguage =
        element.getAttribute('data-language') ||
        element.getAttribute('data-lang');

      var normalizedDataLanguage = normalizeFenceLanguage(dataLanguage);
      if (normalizedDataLanguage) return normalizedDataLanguage;

      var classes = Array.prototype.slice.call(element.classList || []);
      for (var j = 0; j < classes.length; j += 1) {
        var className = classes[j].toLowerCase();
        var rawLanguage = className;

        if (className.indexOf('language-') === 0) {
          rawLanguage = className.slice('language-'.length);
        } else if (className.indexOf('lang-') === 0) {
          rawLanguage = className.slice('lang-'.length);
        }

        var normalizedClassLanguage = normalizeFenceLanguage(rawLanguage);
        if (normalizedClassLanguage) return normalizedClassLanguage;
      }
    }

    return '';
  }

  // T-TXT-2 診斷探針：只有測試文件放入 <!-- sql-highlight-debug --> 時才顯示。
  function hasSqlHighlightDebugMarker(root) {
    if (!root || !document.createTreeWalker) return false;

    var walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_COMMENT,
      null,
      false
    );

    var node;
    while ((node = walker.nextNode())) {
      if (
        node.nodeValue &&
        node.nodeValue.trim().toLowerCase() === 'sql-highlight-debug'
      ) {
        return true;
      }
    }

    return false;
  }

  function describeCodeBlock(code, index) {
    var pre = code ? code.parentElement : null;
    var codeAttrs = code
      ? Array.prototype.map.call(code.attributes, function (attr) {
          return attr.name + '=' + JSON.stringify(attr.value);
        }).join(', ')
      : '';
    var preAttrs = pre
      ? Array.prototype.map.call(pre.attributes, function (attr) {
          return attr.name + '=' + JSON.stringify(attr.value);
        }).join(', ')
      : '';

    return [
      'block[' + index + ']',
      '  detectedLanguage: ' + (getFenceLanguage(code) || '(none)'),
      '  code.className: ' + (code.className || '(empty)'),
      '  pre.className: ' + ((pre && pre.className) || '(empty)'),
      '  code.attributes: ' + (codeAttrs || '(none)'),
      '  pre.attributes: ' + (preAttrs || '(none)'),
      '  text-start: ' + JSON.stringify((code.textContent || '').slice(0, 80))
    ].join('\n');
  }

  function showSqlHighlightDiagnostics(root) {
    if (!hasSqlHighlightDebugMarker(root)) return;

    var blocks = root.querySelectorAll('pre > code');
    var languagesToCheck = ['sql', 'json', 'javascript', 'typescript', 'xml', 'css', 'bash', 'yaml'];
    var lines = [
      'T-TXT-2 HIGHLIGHT DEBUG',
      'hljs loaded: ' + Boolean(window.hljs),
      'hljs.highlight: ' + Boolean(window.hljs && typeof hljs.highlight === 'function')
    ];

    languagesToCheck.forEach(function (language) {
      lines.push(
        language + ' language registered: ' +
        Boolean(window.hljs && typeof hljs.getLanguage === 'function' && hljs.getLanguage(language))
      );
    });

    lines.push('pre > code count: ' + blocks.length, '');

    blocks.forEach(function (code, index) {
      lines.push(describeCodeBlock(code, index));
      lines.push('');
    });

    var panel = document.createElement('pre');
    panel.id = 'sql-highlight-debug-panel';
    panel.textContent = lines.join('\n');
    panel.style.whiteSpace = 'pre-wrap';
    panel.style.wordBreak = 'break-word';
    panel.style.border = '2px solid #8b5e3c';
    panel.style.background = '#fff8ed';
    panel.style.color = '#3d3027';
    panel.style.fontSize = '12px';

    root.insertBefore(panel, root.firstChild);
  }

  // Syntax Highlighting：只處理明確標示且列入支援清單的 fenced code block。
  // 不使用 auto-detect，避免普通 code block 被 renderer 自作聰明猜語言。
  function upgradeCodeHighlightingIn(root) {
    if (!root || !window.hljs) return;

    var blocks = root.querySelectorAll('pre > code');
    if (!blocks.length) return;

    blocks.forEach(function (code) {
      var language = getFenceLanguage(code);
      if (!language) return;
      if (code.dataset.syntaxHighlighted === 'true') return;
      if (typeof hljs.getLanguage === 'function' && !hljs.getLanguage(language)) return;

      try {
        var result = hljs.highlight(code.textContent, {
          language: language,
          ignoreIllegals: true
        });

        code.innerHTML = result.value;
        code.classList.add('hljs', 'language-' + language);
        code.dataset.syntaxHighlighted = 'true';
      } catch (e) {
        console.log('Syntax highlight error (' + language + '):', e);
      }
    });
  }

  // 把 Mermaid fenced code block 轉成圖表容器並交給 Mermaid 繪圖。
  function upgradeMermaidIn(root) {
    if (!root) return;

    var selector =
      'pre > code.language-mermaid,' +
      'pre > code.lang-mermaid,' +
      'pre > code.mermaid';

    var blocks = root.querySelectorAll(selector);
    if (!blocks.length) return;

    blocks.forEach(function (code) {
      var pre = code.parentElement;
      var container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = code.textContent;
      pre.replaceWith(container);
    });

    if (!window.mermaid) return;

    try {
      mermaid.initialize({ startOnLoad: false });
      var mermaidNodes = root.querySelectorAll('.mermaid');
      if (!mermaidNodes.length) return;

      if (typeof mermaid.run === 'function') {
        mermaid.run({ nodes: mermaidNodes });
      } else if (typeof mermaid.init === 'function') {
        mermaid.init(undefined, mermaidNodes);
      }
    } catch (e) {
      console.log('Mermaid render error:', e);
    }
  }

  // Opt-in 人工換頁：只有 Markdown 明確寫入 <!-- pagebreak --> 時才介入。
  function upgradeManualPageBreaksIn(root) {
    if (!root || !document.createTreeWalker) return;

    var walker = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT, null, false);
    var pageBreakComments = [];
    var node;

    while ((node = walker.nextNode())) {
      if (node.nodeValue && node.nodeValue.trim().toLowerCase() === 'pagebreak') {
        pageBreakComments.push(node);
      }
    }

    if (!pageBreakComments.length) return;

    pageBreakComments.forEach(function (comment) {
      var marker = document.createElement('div');
      marker.className = 'page-break';
      marker.setAttribute('aria-hidden', 'true');
      comment.parentNode.replaceChild(marker, comment);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    // 診斷先讀原始 renderer 輸出，再進行各種 DOM enhancement。
    showSqlHighlightDiagnostics(document.body);
    upgradeManualPageBreaksIn(document.body);
    upgradeMermaidIn(document.body);
    upgradeCodeHighlightingIn(document.body);
  });
</script>
