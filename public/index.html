<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Playground</title>
  <style>
    /* 最小部署頁面：第一階段只驗證 Netlify Publish Boundary，不承擔 Experiment Catalog。 */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
      background: #f6f7f9;
      color: #1f2328;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #f6f8fa;
    }

    code {
      word-break: break-all;
    }

    @media (max-width: 520px) {
      body {
        padding: 0.75rem;
      }

      main {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <p><strong>AI Playground</strong></p>
    <h1>Public deployment boundary is ready</h1>
    <p>
      這個頁面目前只用來驗證 Netlify 的公開部署邊界。
      Experiment Demo 與 Catalog 會在後續 Repository 重整時移入這個公開區域。
    </p>

    <section class="status" aria-labelledby="runtime-title">
      <h2 id="runtime-title">Runtime Check</h2>
      <p id="js-status">JavaScript 尚未執行。</p>
      <p>Current URL: <code id="current-url">讀取中…</code></p>
      <p>Browser Time: <code id="browser-time">讀取中…</code></p>
    </section>
  </main>

  <script>
    // 執行最小 Runtime Check，確認切換 Publish Directory 後瀏覽器端 JavaScript 仍正常運作。
    document.getElementById("js-status").textContent = "JavaScript 執行成功。";

    // 顯示目前實際載入網址，方便確認 Netlify Site 仍指向預期 Domain。
    document.getElementById("current-url").textContent = window.location.href;

    // 顯示瀏覽器本地時間，作為最小 Client-side Runtime 證據。
    document.getElementById("browser-time").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
